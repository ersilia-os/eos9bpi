Identifier: eos9bpi
Slug: antimicrobial-activity-enterobacter
Status: Ready
Title: Antimicrobial activity prediction against Enterobacter spp. from public 
  ChEMBL data
Description: Bioactivity prediction of growth inhibition in Enterobacter spp., 
  trained as binary (active/inactive) classifiers from publicly available data 
  in ChEMBL. Independent models are trained on multiple bioactivity datasets, 
  corresponding to dose-response (MIC) assays. A ranking score is provided for 
  each model alongside a combined consensus score.
