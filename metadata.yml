Identifier: eos9bpi
Slug: antimicrobial-activity-enterobacter
Status: Ready
Title: Antimicrobial activity prediction against Enterobacter spp. from public 
  ChEMBL data
Description: Predicts growth inhibition of Enterobacter species, Gram-negative opportunists
  that carry inducible beta-lactamases and readily acquire further resistance in hospital
  settings. Five classifiers were trained over the ChEMBL assay pools with sufficient
  supporting data and merged into a quality-weighted consensus. Coverage is thinner
  than for Escherichia coli or Klebsiella, so the panel is smaller and individual
  sub-models rest on fewer compounds.
